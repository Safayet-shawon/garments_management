name: CI
on:
  push: { branches: [main, winner-apparels-fullstack] }
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: SEO audit against the built server
        run: |
          AUTH_SECRET=ci-secret-ci-secret-ci-secret-ci-secret-1234 ADMIN_PASSWORD=ci-password-123 NODE_ENV=production SITE_URL=http://localhost:8080 node dist-server/index.js &
          sleep 6
          npm run seo:audit
      - name: Lighthouse
        run: |
          AUTH_SECRET=ci-secret-ci-secret-ci-secret-ci-secret-1234 ADMIN_PASSWORD=ci-password-123 NODE_ENV=production node dist-server/index.js &
          sleep 6
          npm run lighthouse
  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t winner-apparels .
