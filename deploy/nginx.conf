# Load balancer + edge cache in front of two app replicas (see docker-compose.yml).
worker_processes auto;
events { worker_connections 2048; }

http {
  include /etc/nginx/mime.types;
  sendfile on; tcp_nopush on; keepalive_timeout 65;
  server_tokens off;

  gzip on; gzip_comp_level 5; gzip_min_length 1024; gzip_vary on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  # least_conn sends each request to the replica with the fewest open connections; failed replicas are skipped
  upstream app_servers {
    least_conn;
    server app1:8080 max_fails=2 fail_timeout=10s;
    server app2:8080 max_fails=2 fail_timeout=10s;
    keepalive 32;
  }

  # CDN-style cache for static assets and the public catalogue
  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=edge:20m max_size=500m inactive=7d use_temp_path=off;
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

  server {
    listen 80;
    server_name _;

    location /assets/ {
      proxy_pass http://app_servers; proxy_http_version 1.1; proxy_set_header Connection "";
      proxy_cache edge; proxy_cache_valid 200 365d; proxy_ignore_headers Set-Cookie;
      add_header X-Cache $upstream_cache_status;
    }
    location /img/ {
      proxy_pass http://app_servers; proxy_http_version 1.1; proxy_set_header Connection "";
      proxy_cache edge; proxy_cache_valid 200 30d;
      add_header X-Cache $upstream_cache_status;
    }
    location = /api/public/catalog {
      proxy_pass http://app_servers; proxy_http_version 1.1; proxy_set_header Connection "";
      proxy_cache edge; proxy_cache_valid 200 60s; proxy_cache_use_stale error timeout updating;
      add_header X-Cache $upstream_cache_status;
    }
    location /api/ {
      limit_req zone=api_limit burst=40 nodelay;
      proxy_pass http://app_servers; proxy_http_version 1.1; proxy_set_header Connection "";
      proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
      proxy_pass http://app_servers; proxy_http_version 1.1; proxy_set_header Connection "";
      proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
